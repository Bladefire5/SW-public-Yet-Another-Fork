- type: entity
  id: MedievalAncientNocturneBatAction
  name: medieval-ancient-nocturne-bat-action-name
  description: medieval-ancient-nocturne-bat-action-desc
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/Medieval/Nocturn/Bat/actions.rsi
      state: bat
  - type: InstantAction
    event: !type:AncientNocturneBatActionEvent

- type: entity
  id: MedievalAncientNocturneRevertAction
  name: medieval-ancient-nocturne-revert-action-name
  description: medieval-ancient-nocturne-revert-action-desc
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/Medieval/Nocturn/Bat/actions.rsi
      state: unbat
  - type: InstantAction
    event: !type:RevertPolymorphActionEvent

- type: entity
  id: MedievalAncientNocturneBat
  parent: MobBat
  name: medieval-ancient-nocturne-bat-name
  description: medieval-ancient-nocturne-bat-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: Grammar
    attributes:
      gender: female
      proper: true
  - type: ActionGrant
    actions:
    - MedievalAncientNocturneRevertAction
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 17
  - type: MobThresholds
    thresholds:
      0: Alive
      95: Critical
      180: Dead

- type: polymorph
  id: MedievalAncientNocturneBatPolymorph
  configuration:
    entity: MedievalAncientNocturneBat
    forced: true
    inventory: None
    transferDamage: true
    transferName: false
    duration: 20
    revertOnCrit: true
    revertOnDeath: true
    allowRepeatedMorphs: false
